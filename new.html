<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Animated Form</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #667eea, #764ba2);
  }

  .container {
    background: #fff;
    padding: 40px;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    width: 100%;
    max-width: 420px;
    animation: slideIn 0.7s ease-out;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  h2 {
    text-align: center;
    margin-bottom: 25px;
    color: #333;
    animation: fadeIn 1s ease 0.3s both;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  .form-group {
    position: relative;
    margin-bottom: 25px;
    animation: fadeIn 0.6s ease both;
  }
  .form-group:nth-child(1) { animation-delay: 0.4s; }
  .form-group:nth-child(2) { animation-delay: 0.5s; }
  .form-group:nth-child(3) { animation-delay: 0.6s; }
  .form-group:nth-child(4) { animation-delay: 0.7s; }
  .form-group:nth-child(5) { animation-delay: 0.8s; }
  .form-group:nth-child(6) { animation-delay: 0.9s; }

  label {
    display: block;
    margin-bottom: 6px;
    color: #555;
    font-size: 14px;
    transition: color 0.3s ease;
  }

  input, textarea, select {
    width: 100%;
    padding: 12px;
    border: 2px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.3s ease, box-shadow 0.3s ease, transform 0.2s ease;
  }

  input:focus, textarea:focus, select:focus {
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102,126,234,0.2);
    transform: scale(1.01);
  }

  .form-group:focus-within label {
    color: #667eea;
  }

  .btn {
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.3s ease, letter-spacing 0.3s ease;
    animation: fadeIn 0.6s ease 0.8s both;
  }

  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(102,126,234,0.4);
    letter-spacing: 1px;
  }

  .btn:active { transform: translateY(0); }

  .success-msg {
    margin-top: 20px;
    padding: 12px;
    background: #d4edda;
    color: #155724;
    border-radius: 8px;
    text-align: center;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  .success-msg.show { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>
  <div class="container">
    <h2>Sign in</h2>
    <form id="myForm">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" placeholder="John Doe" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" placeholder="••••••••" required>
      </div>
      <div class="form-group">
        <label>Role</label>
        <select>
          <option>Student</option>
          <option>Developer</option>
          <option>Designer</option>
        </select>
      </div>
      <div class="form-group">
        <label>Date</label>
        <input type="date" required>
      </div>
      <div class="form-group">
        <label>Time</label>
        <input type="time" required>
      </div>
      <button type="submit" class="btn">Create Account</button>
      <div class="success-msg" id="msg">✅ Form submitted successfully!</div>
    </form>
  </div>

<script>
  document.getElementById('myForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const msg = document.getElementById('msg');
    msg.classList.add('show');
    setTimeout(() => msg.classList.remove('show'), 2500);
  });
</script>
</body>
</html>
